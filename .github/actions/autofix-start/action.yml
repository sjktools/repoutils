name: Start PR Fixes for an /autofix comment
description: >-
  Runs PR Fixes on a pull request for a comment that is just `/autofix`, with
  `repoutils autofix`, hands its fixes to PR Fixes Push, and waits for that to
  report on the pull request. If PR Fixes Push can't, this reports instead.

# Runs repoutils from this action's own commit, with the runner's python3,
# installing nothing. Use it in a job for an issue_comment event, with actions
# write and pull-requests write, and a timeout longer than the timeout input,
# as a job that times out runs no failure() steps. Check out pyproject.toml
# first if [tool.repoutils] sets comment-prefix, as the report comment's marker
# uses it. The workflows must be fix.yml and fix-push.yml, as
# `repoutils autofix --help` describes.
#
# It comments with the job's GITHUB_TOKEN, as github-actions[bot], with the
# marker of fix-push.yml's report job. It reports only a failure, so it posts a
# new comment, which notifies the pull request's subscribers as an edit
# doesn't, and hides the earlier ones as outdated. A fix run started with a
# GITHUB_TOKEN starts no workflow_run workflow, so `repoutils autofix` starts
# fix-push.yml itself.
#
# With relock true, if GitHub refuses to start PR Fixes because actions.lock
# doesn't list every action fix.yml uses, it reports nothing and sets the relock
# output. A later job then runs the autofix-relock action, and a job after that
# runs this action again with relocked-run, which has fix-push.yml push the
# relock's commit before starting PR Fixes again. The workflow must then be
# autofix-comment.yml, with the run-name "Comment on #<number>", and the job
# that runs autofix-relock named relock.
inputs:
  pr:
    description: The pull request's number.
    required: true
  comment-id:
    description: The comment's ID, to react to with a rocket once PR Fixes starts.
    required: true
  comment-body:
    description: The comment's body. Nothing runs unless it's /autofix, whitespace aside.
    required: true
  timeout:
    description: Minutes to wait for the fixes to be pushed.
    required: false
    default: "40"
  relock:
    description: >-
      Set to true to set the relock output, and report nothing, if GitHub
      refuses to start PR Fixes because actions.lock is incomplete.
    required: false
    default: "false"
  relocked-run:
    description: >-
      The ID of this workflow's run, whose relock job relocked actions.lock
      after the relock output was set: push the relock's commit first.
    required: false
    default: ""
outputs:
  relock:
    description: true if a later job should relock actions.lock (with relock true only).
    value: ${{ steps.autofix.outputs.relock }}
  head-sha:
    description: The commit to relock, when relock is true.
    value: ${{ steps.autofix.outputs.head_sha }}

runs:
  using: composite
  steps:
    - name: Check the comment is only /autofix
      id: check
      shell: bash
      env:
        BODY: ${{ inputs.comment-body }}
      run: |
        if [[ $BODY =~ ^[[:space:]]*/autofix[[:space:]]*$ ]]; then
          echo "matched=true" >> "$GITHUB_OUTPUT"
        else
          echo "Comment has more than /autofix in it; not running PR Fixes."
        fi

    - name: Run PR Fixes and push its fixes
      id: autofix
      if: steps.check.outputs.matched == 'true'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
        PR: ${{ inputs.pr }}
        COMMENT_ID: ${{ inputs.comment-id }}
        TIMEOUT: ${{ inputs.timeout }}
        RELOCK: ${{ inputs.relock }}
        RELOCKED_RUN: ${{ inputs.relocked-run }}
        PYTHONPATH: ${{ github.action_path }}/../../../src
        PYTHONSAFEPATH: "1"
      run: |
        if [ "$RELOCK" != true ] && [ "$RELOCK" != false ]; then
          echo "::error::relock must be true or false, not $RELOCK."
          exit 1
        fi
        args=()
        # A relocked run never relocks again.
        if [ -n "$RELOCKED_RUN" ]; then
          args+=(--relocked "$RELOCKED_RUN")
        elif [ "$RELOCK" = true ]; then
          args+=(--relock "$GITHUB_OUTPUT")
        fi
        python3 -m repoutils autofix "$PR" --comment-id "$COMMENT_ID" --timeout "$TIMEOUT" \
          --report "$RUNNER_TEMP/autofix-report.md" "${args[@]}"

    # `repoutils autofix` writes the report only if PR Fixes Push didn't
    # comment on the pull request itself. If GitHub refused to start a run,
    # the report gives GitHub's reason.
    - name: Report on the pull request
      if: failure() && steps.autofix.outcome == 'failure'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
        PR: ${{ inputs.pr }}
        PYTHONPATH: ${{ github.action_path }}/../../../src
        PYTHONSAFEPATH: "1"
      run: |
        report="$RUNNER_TEMP/autofix-report.md"
        if [ -f "$report" ]; then
          python3 -m repoutils post-comment "$PR" "$report" --name autofix --author "github-actions[bot]" --hide-previous
        fi
