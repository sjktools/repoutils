name: Open a version bump pull request
description: >-
  Checks out the default branch, bumps [project] version in pyproject.toml,
  and the project's own entry in uv.lock, and opens a pull request for it,
  with `repoutils bump-version --pr`.

# A Bump Version workflow's one job, in an environment that only the default
# branch can deploy to, which holds the token. It runs only repoutils, from
# this action's own commit, with the runner's python3, installing nothing, and
# edits the two files as text, so no uv or build backend runs alongside the
# token.
inputs:
  bump:
    description: The part of the version to bump, patch, minor or major.
    required: true
  token:
    description: >-
      A token with Contents and Pull requests write, which pushes the branch
      and opens the pull request. A pull request that a GITHUB_TOKEN opens
      starts no workflow run, so use another token for one that CI should
      check.
    required: true
  auto-merge:
    description: Turn on auto-merge for the pull request, with this merge method, merge, squash or rebase (default, none).
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Check the token is set
      shell: bash
      env:
        TOKEN: ${{ inputs.token }}
      run: |
        if [ -z "$TOKEN" ]; then
          echo "::error::The token input is empty: is the secret set, and in the job's environment if it has one?"
          exit 1
        fi

    # The pull request goes into the default branch. The stored token is what
    # `bump-version --pr` pushes with.
    - uses: actions/checkout@v7.0.1
      with:
        ref: ${{ github.event.repository.default_branch }}
        token: ${{ inputs.token }}
        persist-credentials: true

    - name: Open the pull request
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
        BUMP: ${{ inputs.bump }}
        AUTO_MERGE: ${{ inputs.auto-merge }}
        PYTHONPATH: ${{ github.action_path }}/../../../src
        PYTHONSAFEPATH: "1"
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        python3 -m repoutils bump-version "$BUMP" --pr ${AUTO_MERGE:+--auto-merge "$AUTO_MERGE"}
