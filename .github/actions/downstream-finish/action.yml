name: Finish a downstream bump
description: >-
  Waits for the checks on a bump's pull request in a downstream repository,
  with `repoutils downstream finish`. If only GitHub Actions jobs fail, it
  re-runs them, and waits again. Fails if any still fails. If they all pass,
  it closes a dev version's test pull request without merging it, deleting
  its branch, but leaves a release's pull request open for review.

# The finish job of a Bump downstream workflow (see the README),
# once for each downstream, in an environment that only main can deploy to,
# which holds the token. It runs only repoutils, from this action's own
# commit, with the runner's python3, installing nothing, and runs no code from
# the downstream. It runs in the upstream's checkout, which gives the
# package's name.
inputs:
  repository:
    description: The downstream, as owner/name.
    required: true
  version:
    description: The version that the pull request bumps to, a release such as 0.5.0, or a dev version on TestPyPI such as 0.4.1.dev123.
    required: true
  token:
    description: >-
      A token with Actions write on the downstream, which re-runs failed jobs,
      and Contents and Pull requests write, which close a test pull request
      and delete its branch. On a private downstream, it also needs Commit
      statuses read and Checks read, to read its checks.
    required: true
  package:
    description: The package that was bumped (default, the [project] name in the upstream's pyproject.toml).
    required: false
    default: ""
  timeout:
    description: How many seconds to wait for the checks.
    required: false
    default: "3600"
  retries:
    description: How many times to re-run the failed jobs if only GitHub Actions jobs fail, from 0 to 9.
    required: false
    default: "1"

runs:
  using: composite
  steps:
    - name: Check the token is set
      shell: bash
      env:
        TOKEN: ${{ inputs.token }}
      run: |
        if [ -z "$TOKEN" ]; then
          echo "::error::The token input is empty: is the secret set in the job's environment?"
          exit 1
        fi

    - name: Finish the pull request
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
        PACKAGE: ${{ inputs.package }}
        REPOSITORY: ${{ inputs.repository }}
        RETRIES: ${{ inputs.retries }}
        TIMEOUT: ${{ inputs.timeout }}
        VERSION: ${{ inputs.version }}
        PYTHONPATH: ${{ github.action_path }}/../../../src
        PYTHONSAFEPATH: "1"
      run: |
        python3 -m repoutils downstream finish --repo "$REPOSITORY" --version "$VERSION" \
          --timeout "$TIMEOUT" --retries "$RETRIES" ${PACKAGE:+--package "$PACKAGE"}
