name: Install age
description: >-
  Installs age (https://age-encryption.org) from its release tarball, checked
  against its SHA-256, and puts age and age-keygen on the PATH.

# export-secrets.yml runs this to encrypt its backups, and ci.yml's
# secrets-export job runs it to check that exporting still works, so the
# version and its hash live in one place. Update both together.
runs:
  using: composite
  steps:
    - name: Install age
      shell: bash
      env:
        AGE_VERSION: v1.3.2
        AGE_SHA256: cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10
      run: |
        curl -fsSL -o "$RUNNER_TEMP/age.tar.gz" \
          "https://github.com/FiloSottile/age/releases/download/$AGE_VERSION/age-$AGE_VERSION-linux-amd64.tar.gz"
        echo "$AGE_SHA256  $RUNNER_TEMP/age.tar.gz" | sha256sum --check --strict
        tar -xzf "$RUNNER_TEMP/age.tar.gz" -C "$RUNNER_TEMP" age/age age/age-keygen
        rm "$RUNNER_TEMP/age.tar.gz"
        echo "$RUNNER_TEMP/age" >> "$GITHUB_PATH"
