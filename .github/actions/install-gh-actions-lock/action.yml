name: Install gh-actions-lock
description: >-
  Installs the github/gh-actions-lock gh extension from its release binary,
  checked against its SHA-256, so `gh actions-lock` runs.

# ci.yml's check-and-build job runs this so `just check` can verify
# actions.lock, and fix.yml's fix job runs it so `just fix` can regenerate it.
# The version and its hash live in install.sh, which the downstream-bump and
# downstream-push actions run too. `gh extension install --pin` takes only a
# release tag for a precompiled extension, so a moved tag or a replaced asset
# could swap it. Instead this installs the checked binary as a local
# extension, from a directory named after it.
runs:
  using: composite
  steps:
    - name: Install gh-actions-lock
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/install.sh"
