name: Export Secrets

# Backs up the values of the secrets pyproject.toml lists, as TOML encrypted
# with age (https://age-encryption.org) to the maintainer's SSH key, so only
# its private key can read them. The plaintext only ever goes to age's
# standard input. Each job uploads its file as an artifact kept for a day,
# which the job summary links to: download it, then delete it from the run.
# Anyone signed in to GitHub can download a public repository's artifacts, so
# a later leak of the private key would expose any export still around, and
# age's SSH recipients aren't post-quantum. Dependabot secrets can't be
# exported, as only Dependabot's runs get them.
#
# Run it from main. Each job's `if` skips it on other branches, but a branch
# can edit that: only the release job's secrets are kept from other branches,
# by the release environment, as for any workflow that uses secrets.
on:
  workflow_dispatch:

permissions: {}

env:
  # age's release tarball, pinned by version and SHA-256.
  AGE_VERSION: v1.3.2
  AGE_SHA256: cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10
  # The key to encrypt to: the key of this GitHub user's (from
  # https://github.com/<user>.keys) with this fingerprint (`ssh-keygen -l`).
  EXPORT_KEY: skissane/SHA256:OcGOAWW3fEw3QIdER4uN6bOnHkGbqjxtwHiRRp3ZGMo

jobs:
  repository:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # repoutils runs from source with the runner's python3, installing nothing.
      - name: Checkout repoutils' source
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            /pyproject.toml
            /src/repoutils/
          sparse-checkout-cone-mode: false

      - name: Install age
        run: |
          curl -fsSL -o "$RUNNER_TEMP/age.tar.gz" \
            "https://github.com/FiloSottile/age/releases/download/$AGE_VERSION/age-$AGE_VERSION-linux-amd64.tar.gz"
          echo "$AGE_SHA256  $RUNNER_TEMP/age.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/age.tar.gz" -C "$RUNNER_TEMP" age/age

      - name: Export the repository's secrets
        env:
          SECRETS_JSON: ${{ toJSON(secrets) }}
        run: >-
          PYTHONPATH=src python3 -m repoutils secrets export
          --github-key "$EXPORT_KEY" --age "$RUNNER_TEMP/age/age"
          --output "$RUNNER_TEMP/secrets-repository.toml.age"

      - name: Upload the encrypted secrets
        id: upload
        uses: actions/upload-artifact@v7.0.2
        with:
          name: secrets-repository
          path: ${{ runner.temp }}/secrets-repository.toml.age
          retention-days: 1
          if-no-files-found: error

      - name: Link the artifact from the summary
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        run: |
          {
            echo "Artifact: [secrets-repository]($ARTIFACT_URL)"
            echo
            echo "Once downloaded, delete it: \`gh api -X DELETE repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # One job per environment that pyproject.toml lists secrets for, as a job
  # only gets the secrets of the environment it deploys to.
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    steps:
      - name: Checkout repoutils' source
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            /pyproject.toml
            /src/repoutils/
          sparse-checkout-cone-mode: false

      - name: Install age
        run: |
          curl -fsSL -o "$RUNNER_TEMP/age.tar.gz" \
            "https://github.com/FiloSottile/age/releases/download/$AGE_VERSION/age-$AGE_VERSION-linux-amd64.tar.gz"
          echo "$AGE_SHA256  $RUNNER_TEMP/age.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/age.tar.gz" -C "$RUNNER_TEMP" age/age

      - name: Export the release environment's secrets
        env:
          SECRETS_JSON: ${{ toJSON(secrets) }}
        run: >-
          PYTHONPATH=src python3 -m repoutils secrets export --environment release
          --github-key "$EXPORT_KEY" --age "$RUNNER_TEMP/age/age"
          --output "$RUNNER_TEMP/secrets-release.toml.age"

      - name: Upload the encrypted secrets
        id: upload
        uses: actions/upload-artifact@v7.0.2
        with:
          name: secrets-release
          path: ${{ runner.temp }}/secrets-release.toml.age
          retention-days: 1
          if-no-files-found: error

      - name: Link the artifact from the summary
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        run: |
          {
            echo "Artifact: [secrets-release]($ARTIFACT_URL)"
            echo
            echo "Once downloaded, delete it: \`gh api -X DELETE repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID\`"
          } >> "$GITHUB_STEP_SUMMARY"
