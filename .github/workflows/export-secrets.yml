name: Export Secrets

# Backs up the values of the secrets pyproject.toml lists, as TOML encrypted
# with age (https://age-encryption.org) to the SSH key the SECRETS_EXPORT_KEY
# variable names, so only its private key can read them. The plaintext only ever goes to age's
# standard input. Each job uploads its file as an artifact kept for a day,
# which the job summary links to: download it, then delete it from the run.
# Anyone signed in to GitHub can download a public repository's artifacts, so
# a later leak of the private key would expose any export still around, and
# age's SSH recipients aren't post-quantum. Dependabot secrets can't be
# exported, as only Dependabot's runs get them.
# `repoutils secrets export-remote` runs this workflow, decrypts what it
# exports with your SSH key, and deletes the artifacts.
#
# Run it from main. Each job's `if` skips it on other branches, but a branch
# can edit that: only the release, autofix, uv-bump and downstream jobs' secrets are kept from other
# branches, by their environments, as for any workflow that uses secrets.
on:
  workflow_dispatch:
    inputs:
      # `repoutils secrets export-remote` lists the secret names set at the
      # repository and in each environment, which the run's GITHUB_TOKEN can't,
      # and passes them here as JSON. With them, an environment's job can tell
      # its own secrets from those it inherits from the repository or the
      # organization. Left empty, as when started from the Actions page, the
      # environments' summaries say they can't.
      secret-names:
        description: "Secret names at each level, as JSON (filled in by repoutils secrets export-remote)"
        required: false
        default: ""

permissions: {}

env:
  SECRET_NAMES: ${{ inputs.secret-names }}
  # The key to encrypt to, as USER/SHA256:FINGERPRINT: the key of that GitHub
  # user's (from https://github.com/<user>.keys) with that fingerprint, as
  # `ssh-keygen -l` prints it. A variable, so a fork can name its own key, and
  # a new key needs no commit. ci.yml's secrets-export job checks it on PRs.
  SECRETS_EXPORT_KEY: ${{ vars.SECRETS_EXPORT_KEY }}

jobs:
  repository:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # repoutils runs from source with the runner's python3, installing nothing
      # but age.
      - name: Checkout repoutils' source
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            /.github/actions/install-age/
            /pyproject.toml
            /src/repoutils/
          sparse-checkout-cone-mode: false

      - name: Check SECRETS_EXPORT_KEY is set
        run: |
          if [ -z "$SECRETS_EXPORT_KEY" ]; then
            echo "::error::Set the SECRETS_EXPORT_KEY variable to USER/SHA256:FINGERPRINT, the GitHub key to encrypt to."
            exit 1
          fi

      # Pinned by version and SHA-256 in the action.
      - name: Install age
        uses: $/.github/actions/install-age

      - name: Export the repository's secrets
        env:
          SECRETS_JSON: ${{ toJSON(secrets) }}
        run: |
          trap 'mkdir -p "$RUNNER_TEMP/step-summaries" && cp "$GITHUB_STEP_SUMMARY" "$RUNNER_TEMP/step-summaries/export.md"' EXIT
          PYTHONPATH=src python3 -m repoutils secrets export \
            --armor --github-key "$SECRETS_EXPORT_KEY" \
            --output "$RUNNER_TEMP/secrets-repository.toml.age"

      - name: Upload the encrypted secrets
        id: upload
        uses: actions/upload-artifact@v7.0.2
        with:
          name: secrets-repository
          path: ${{ runner.temp }}/secrets-repository.toml.age
          retention-days: 1
          if-no-files-found: error

      - name: Link the artifact from the summary
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        run: |
          trap 'mkdir -p "$RUNNER_TEMP/step-summaries" && cp "$GITHUB_STEP_SUMMARY" "$RUNNER_TEMP/step-summaries/artifact-link.md"' EXIT
          {
            echo "Artifact: [secrets-repository]($ARTIFACT_URL)"
            echo
            echo "Once downloaded, delete it: \`gh api -X DELETE repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # GitHub's API doesn't serve step summaries, so each step that writes one
      # copies it to step-summaries/ for this artifact (see AGENTS.md).
      - name: Upload the step summaries
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: step-summaries-${{ github.job }}
          path: ${{ runner.temp }}/step-summaries/
          if-no-files-found: ignore

  # One job per environment that pyproject.toml lists secrets for, as a job
  # only gets the secrets of the environment it deploys to.
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    steps:
      - name: Checkout repoutils' source
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            /.github/actions/install-age/
            /pyproject.toml
            /src/repoutils/
          sparse-checkout-cone-mode: false

      - name: Check SECRETS_EXPORT_KEY is set
        run: |
          if [ -z "$SECRETS_EXPORT_KEY" ]; then
            echo "::error::Set the SECRETS_EXPORT_KEY variable to USER/SHA256:FINGERPRINT, the GitHub key to encrypt to."
            exit 1
          fi

      # Pinned by version and SHA-256 in the action.
      - name: Install age
        uses: $/.github/actions/install-age

      - name: Export the release environment's secrets
        env:
          SECRETS_JSON: ${{ toJSON(secrets) }}
        run: |
          trap 'mkdir -p "$RUNNER_TEMP/step-summaries" && cp "$GITHUB_STEP_SUMMARY" "$RUNNER_TEMP/step-summaries/export.md"' EXIT
          PYTHONPATH=src python3 -m repoutils secrets export --environment release \
            --armor --github-key "$SECRETS_EXPORT_KEY" \
            --output "$RUNNER_TEMP/secrets-release.toml.age"

      - name: Upload the encrypted secrets
        id: upload
        uses: actions/upload-artifact@v7.0.2
        with:
          name: secrets-release
          path: ${{ runner.temp }}/secrets-release.toml.age
          retention-days: 1
          if-no-files-found: error

      - name: Link the artifact from the summary
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        run: |
          trap 'mkdir -p "$RUNNER_TEMP/step-summaries" && cp "$GITHUB_STEP_SUMMARY" "$RUNNER_TEMP/step-summaries/artifact-link.md"' EXIT
          {
            echo "Artifact: [secrets-release]($ARTIFACT_URL)"
            echo
            echo "Once downloaded, delete it: \`gh api -X DELETE repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # GitHub's API doesn't serve step summaries, so each step that writes one
      # copies it to step-summaries/ for this artifact (see AGENTS.md).
      - name: Upload the step summaries
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: step-summaries-${{ github.job }}
          path: ${{ runner.temp }}/step-summaries/
          if-no-files-found: ignore

  autofix:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: autofix
    permissions:
      contents: read
    steps:
      - name: Checkout repoutils' source
        uses: actions/checkout@v7.0.1
        with:
