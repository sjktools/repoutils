        with:
          name: secrets-downstream
          path: ${{ runner.temp }}/secrets-downstream.toml.age
          retention-days: 1
          if-no-files-found: error

      - name: Link the artifact from the summary
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        run: |
          trap 'mkdir -p "$RUNNER_TEMP/step-summaries" && cp "$GITHUB_STEP_SUMMARY" "$RUNNER_TEMP/step-summaries/artifact-link.md"' EXIT
          {
            echo "Artifact: [secrets-downstream]($ARTIFACT_URL)"
            echo
            echo "Once downloaded, delete it: \`gh api -X DELETE repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # GitHub's API doesn't serve step summaries, so each step that writes one
