      # Pinned by version and SHA-256 in the action.
      - name: Install age
        uses: $/.github/actions/install-age

      - name: Export the autofix environment's secrets
        env:
          SECRETS_JSON: ${{ toJSON(secrets) }}
        run: |
          trap 'mkdir -p "$RUNNER_TEMP/step-summaries" && cp "$GITHUB_STEP_SUMMARY" "$RUNNER_TEMP/step-summaries/export.md"' EXIT
          PYTHONPATH=src python3 -m repoutils secrets export --environment autofix \
            --armor --github-key "$SECRETS_EXPORT_KEY" \
            --output "$RUNNER_TEMP/secrets-autofix.toml.age"

      - name: Upload the encrypted secrets
        id: upload
        uses: actions/upload-artifact@v7.0.2
        with:
          name: secrets-autofix
          path: ${{ runner.temp }}/secrets-autofix.toml.age
          retention-days: 1
          if-no-files-found: error

      - name: Link the artifact from the summary
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        run: |
          trap 'mkdir -p "$RUNNER_TEMP/step-summaries" && cp "$GITHUB_STEP_SUMMARY" "$RUNNER_TEMP/step-summaries/artifact-link.md"' EXIT
          {
            echo "Artifact: [secrets-autofix]($ARTIFACT_URL)"
            echo
            echo "Once downloaded, delete it: \`gh api -X DELETE repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # GitHub's API doesn't serve step summaries, so each step that writes one
      # copies it to step-summaries/ for this artifact (see AGENTS.md).
      - name: Upload the step summaries
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: step-summaries-${{ github.job }}
          path: ${{ runner.temp }}/step-summaries/
          if-no-files-found: ignore

  uv-bump:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: uv-bump
    permissions:
      contents: read
    steps:
      - name: Checkout repoutils' source
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            /.github/actions/install-age/
            /pyproject.toml
            /src/repoutils/
          sparse-checkout-cone-mode: false

      - name: Check SECRETS_EXPORT_KEY is set
        run: |
          if [ -z "$SECRETS_EXPORT_KEY" ]; then
            echo "::error::Set the SECRETS_EXPORT_KEY variable to USER/SHA256:FINGERPRINT, the GitHub key to encrypt to."
            exit 1
          fi

      # Pinned by version and SHA-256 in the action.
      - name: Install age
        uses: $/.github/actions/install-age

      - name: Export the uv-bump environment's secrets
        env:
          SECRETS_JSON: ${{ toJSON(secrets) }}
        run: |
          trap 'mkdir -p "$RUNNER_TEMP/step-summaries" && cp "$GITHUB_STEP_SUMMARY" "$RUNNER_TEMP/step-summaries/export.md"' EXIT
          PYTHONPATH=src python3 -m repoutils secrets export --environment uv-bump \
            --armor --github-key "$SECRETS_EXPORT_KEY" \
            --output "$RUNNER_TEMP/secrets-uv-bump.toml.age"

      - name: Upload the encrypted secrets
        id: upload
        uses: actions/upload-artifact@v7.0.2
        with:
          name: secrets-uv-bump
          path: ${{ runner.temp }}/secrets-uv-bump.toml.age
          retention-days: 1
          if-no-files-found: error

      - name: Link the artifact from the summary
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        run: |
          trap 'mkdir -p "$RUNNER_TEMP/step-summaries" && cp "$GITHUB_STEP_SUMMARY" "$RUNNER_TEMP/step-summaries/artifact-link.md"' EXIT
          {
            echo "Artifact: [secrets-uv-bump]($ARTIFACT_URL)"
            echo
            echo "Once downloaded, delete it: \`gh api -X DELETE repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # GitHub's API doesn't serve step summaries, so each step that writes one
      # copies it to step-summaries/ for this artifact (see AGENTS.md).
      - name: Upload the step summaries
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: step-summaries-${{ github.job }}
          path: ${{ runner.temp }}/step-summaries/
          if-no-files-found: ignore

  downstream:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: downstream
    permissions:
      contents: read
    steps:
      - name: Checkout repoutils' source
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            /.github/actions/install-age/
            /pyproject.toml
            /src/repoutils/
          sparse-checkout-cone-mode: false

      - name: Check SECRETS_EXPORT_KEY is set
        run: |
          if [ -z "$SECRETS_EXPORT_KEY" ]; then
            echo "::error::Set the SECRETS_EXPORT_KEY variable to USER/SHA256:FINGERPRINT, the GitHub key to encrypt to."
            exit 1
          fi

      # Pinned by version and SHA-256 in the action.
      - name: Install age
        uses: $/.github/actions/install-age

      - name: Export the downstream environment's secrets
        env:
          SECRETS_JSON: ${{ toJSON(secrets) }}
        run: |
          trap 'mkdir -p "$RUNNER_TEMP/step-summaries" && cp "$GITHUB_STEP_SUMMARY" "$RUNNER_TEMP/step-summaries/export.md"' EXIT
