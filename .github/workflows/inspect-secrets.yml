name: Inspect Secrets

# Reports what each secret pyproject.toml lists is, to the job summary: each
# GitHub token's type, owner, expiry and the start of its SHA-256 hash, and each
# SSH key's fingerprint, so it can be matched to its row on GitHub's settings
# pages. It never shows a value. It fails if GitHub rejects a token, or it
# expires within 14 days, and warns about any secret a job gets that
# pyproject.toml doesn't list for it. Dependabot secrets can't be inspected, as only Dependabot's runs get them.
#
# Run it from main. Each job's `if` skips it on other branches, but a branch
# can edit that: only the release, autofix, uv-bump and downstream jobs' secrets are kept from other
# branches, by their environments, as for any workflow that uses secrets.
# The summary is as public as the run's logs.
on:
  workflow_dispatch:
    inputs:
      # `repoutils secrets inspect-remote` lists the secret names set at the
      # repository and in each environment, which the run's GITHUB_TOKEN can't,
      # and passes them here as JSON. With them, an environment's job can tell
      # its own secrets from those it inherits from the repository or the
      # organization. Left empty, as when started from the Actions page, the
      # environments' summaries say they can't.
      secret-names:
        description: "Secret names at each level, as JSON (filled in by repoutils secrets inspect-remote)"
        required: false
        default: ""

permissions: {}

# Each job runs the inspect-secrets action, which checks out only
# pyproject.toml, runs repoutils from the action's own commit with the
# runner's python3, installing nothing, and uploads the step summary.
jobs:
  repository:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Inspect the repository's secrets
        uses: $/.github/actions/inspect-secrets
        with:
          secrets-json: ${{ toJSON(secrets) }}
          secret-names: ${{ inputs.secret-names }}

  # One job per environment that pyproject.toml lists secrets for, as a job
  # only gets the secrets of the environment it deploys to.
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    steps:
      - name: Inspect the release environment's secrets
        uses: $/.github/actions/inspect-secrets
        with:
          secrets-json: ${{ toJSON(secrets) }}
          environment: release
          secret-names: ${{ inputs.secret-names }}

  autofix:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: autofix
    permissions:
      contents: read
    steps:
      - name: Inspect the autofix environment's secrets
        uses: $/.github/actions/inspect-secrets
        with:
          secrets-json: ${{ toJSON(secrets) }}
          environment: autofix
          secret-names: ${{ inputs.secret-names }}

  uv-bump:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: uv-bump
    permissions:
      contents: read
    steps:
      - name: Inspect the uv-bump environment's secrets
        uses: $/.github/actions/inspect-secrets
        with:
          secrets-json: ${{ toJSON(secrets) }}
          environment: uv-bump
          secret-names: ${{ inputs.secret-names }}

  downstream:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: downstream
    permissions:
      contents: read
    steps:
      - name: Inspect the downstream environment's secrets
        uses: $/.github/actions/inspect-secrets
        with:
          secrets-json: ${{ toJSON(secrets) }}
          environment: downstream
          secret-names: ${{ inputs.secret-names }}
