name: Inspect Secrets

# Reports what each secret pyproject.toml lists is, to the job summary: each
# GitHub token's type, owner, expiry and what it can reach, and each SSH key's
# fingerprint, so it can be matched to its row on GitHub's settings pages. It
# never shows a value. It fails if GitHub rejects a token, or it expires within
# 14 days. Dependabot secrets can't be inspected, as only Dependabot's runs get them.
#
# Run it from main. Each job's `if` skips it on other branches, but a branch
# can edit that: only the release job's secrets are kept from other branches,
# by the release environment, as for any workflow that uses secrets.
# The summary is as public as the run's logs.
on:
  workflow_dispatch:

permissions: {}

jobs:
  repository:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # repoutils runs from source with the runner's python3, installing nothing.
      - name: Checkout repoutils' source
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            /pyproject.toml
            /src/repoutils/
          sparse-checkout-cone-mode: false

      - name: Inspect the repository's secrets
        env:
          SECRETS_JSON: ${{ toJSON(secrets) }}
        run: PYTHONPATH=src python3 -m repoutils secrets inspect

  # One job per environment that pyproject.toml lists secrets for, as a job
  # only gets the secrets of the environment it deploys to.
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    steps:
      - name: Checkout repoutils' source
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            /pyproject.toml
            /src/repoutils/
          sparse-checkout-cone-mode: false

      - name: Inspect the release environment's secrets
        env:
          SECRETS_JSON: ${{ toJSON(secrets) }}
        run: PYTHONPATH=src python3 -m repoutils secrets inspect --environment release
