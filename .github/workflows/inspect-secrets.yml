name: Inspect Secrets

# Reports what each secret pyproject.toml lists is, to the job summary: each
# GitHub token's type, owner, expiry and the start of its SHA-256 hash, and each
# SSH key's fingerprint, so it can be matched to its row on GitHub's settings
# pages. It never shows a value. It fails if GitHub rejects a token, or it
# expires within 14 days, and warns about any secret a job gets that
# pyproject.toml doesn't list for it. Dependabot secrets can't be inspected, as only Dependabot's runs get them.
#
# Run it from main. The plan job's `if` skips every job on other branches, but a branch
# can edit that: only the release, autofix, uv-bump and downstream environments' secrets are kept from other
# branches, by their environments, as for any workflow that uses secrets.
# The summary is as public as the run's logs.
on:
  workflow_dispatch:
    inputs:
      # `repoutils secrets inspect-remote` lists the secret names set at the
      # repository and in each environment, which the run's GITHUB_TOKEN can't,
      # and passes them here as JSON. With them, an environment's job can tell
      # its own secrets from those it inherits from the repository or the
      # organization. Left empty, as when started from the Actions page, the
      # environments' summaries say they can't.
      secret-names:
        description: "Secret names at each level, as JSON (filled in by repoutils secrets inspect-remote)"
        required: false
        default: ""

permissions: {}

jobs:
  # Lists the environments pyproject.toml lists secrets for, so the matrix
  # below never drifts from it. repoutils runs from source with the runner's
  # python3, installing nothing.
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      environments: ${{ steps.plan.outputs.environments }}
    steps:
      - name: Checkout repoutils' source
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            /pyproject.toml
            /src/repoutils/
          sparse-checkout-cone-mode: false

      - name: List the environments
        id: plan
        env:
          PYTHONSAFEPATH: "1"
        run: |
          environments=$(PYTHONPATH=src python3 -m repoutils secrets environments --with-repository)
          echo "environments=$environments" >> "$GITHUB_OUTPUT"

  # One job for the repository's secrets (the empty environment) and one for
  # each environment, as a job only gets the secrets of the environment it
  # deploys to. Each runs the inspect-secrets action, which checks out only
  # pyproject.toml, runs repoutils from the action's own commit with the
  # runner's python3, installing nothing, and uploads the step summary.
  inspect:
    needs: plan
    name: inspect ${{ matrix.environment || 'repository' }}
    strategy:
      # One environment's failure, such as an expiring token, mustn't cancel
      # the others' reports.
      fail-fast: false
      matrix:
        environment: ${{ fromJSON(needs.plan.outputs.environments) }}
    runs-on: ubuntu-latest
    # An empty name deploys to no environment, so that job gets only the
    # repository's and the organization's secrets.
    environment: ${{ matrix.environment }}
    permissions:
      contents: read
    steps:
      - name: Inspect the secrets
        uses: $/.github/actions/inspect-secrets
        with:
          secrets-json: ${{ toJSON(secrets) }}
          environment: ${{ matrix.environment }}
          secret-names: ${{ inputs.secret-names }}
