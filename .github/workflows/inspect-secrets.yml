name: Inspect Secrets

# Reports what each secret pyproject.toml lists is, to the job summary: each
# GitHub token's type, owner, expiry and the start of its SHA-256 hash, and each
# SSH key's fingerprint, so it can be matched to its row on GitHub's settings
# pages. It never shows a value. It fails if GitHub rejects a token, or it
# expires within 14 days, and warns about any secret a job gets that
# pyproject.toml doesn't list for it. Dependabot secrets can't be inspected, as only Dependabot's runs get them.
#
# Run it from main. Each job's `if` skips it on other branches, but a branch
# can edit that: only the release, autofix and uv-bump jobs' secrets are kept from other
# branches, by their environments, as for any workflow that uses secrets.
# The summary is as public as the run's logs.
on:
  workflow_dispatch:
    inputs:
      # `repoutils secrets inspect-remote` lists the secret names set at the
      # repository and in each environment, which the run's GITHUB_TOKEN can't,
      # and passes them here as JSON. With them, an environment's job can tell
      # its own secrets from those it inherits from the repository or the
      # organization. Left empty, as when started from the Actions page, the
      # environments' summaries say they can't.
      secret-names:
        description: "Secret names at each level, as JSON (filled in by repoutils secrets inspect-remote)"
        required: false
        default: ""

permissions: {}

env:
  SECRET_NAMES: ${{ inputs.secret-names }}

jobs:
  repository:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # repoutils runs from source with the runner's python3, installing nothing.
      - name: Checkout repoutils' source
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            /pyproject.toml
            /src/repoutils/
          sparse-checkout-cone-mode: false

      - name: Inspect the repository's secrets
        env:
          SECRETS_JSON: ${{ toJSON(secrets) }}
        run: |
          trap 'mkdir -p "$RUNNER_TEMP/step-summaries" && cp "$GITHUB_STEP_SUMMARY" "$RUNNER_TEMP/step-summaries/inspect.md"' EXIT
          PYTHONPATH=src python3 -m repoutils secrets inspect

      # GitHub's API doesn't serve step summaries, so each step that writes one
      # copies it to step-summaries/ for this artifact (see AGENTS.md).
      - name: Upload the step summaries
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: step-summaries-${{ github.job }}
          path: ${{ runner.temp }}/step-summaries/
          if-no-files-found: ignore

  # One job per environment that pyproject.toml lists secrets for, as a job
  # only gets the secrets of the environment it deploys to.
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    steps:
      - name: Checkout repoutils' source
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            /pyproject.toml
            /src/repoutils/
          sparse-checkout-cone-mode: false

      - name: Inspect the release environment's secrets
        env:
          SECRETS_JSON: ${{ toJSON(secrets) }}
        run: |
          trap 'mkdir -p "$RUNNER_TEMP/step-summaries" && cp "$GITHUB_STEP_SUMMARY" "$RUNNER_TEMP/step-summaries/inspect.md"' EXIT
          PYTHONPATH=src python3 -m repoutils secrets inspect --environment release

      # GitHub's API doesn't serve step summaries, so each step that writes one
      # copies it to step-summaries/ for this artifact (see AGENTS.md).
      - name: Upload the step summaries
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: step-summaries-${{ github.job }}
          path: ${{ runner.temp }}/step-summaries/
          if-no-files-found: ignore

  autofix:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: autofix
    permissions:
      contents: read
    steps:
      - name: Checkout repoutils' source
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            /pyproject.toml
            /src/repoutils/
          sparse-checkout-cone-mode: false

      - name: Inspect the autofix environment's secrets
        env:
          SECRETS_JSON: ${{ toJSON(secrets) }}
        run: |
          trap 'mkdir -p "$RUNNER_TEMP/step-summaries" && cp "$GITHUB_STEP_SUMMARY" "$RUNNER_TEMP/step-summaries/inspect.md"' EXIT
          PYTHONPATH=src python3 -m repoutils secrets inspect --environment autofix

      # GitHub's API doesn't serve step summaries, so each step that writes one
      # copies it to step-summaries/ for this artifact (see AGENTS.md).
      - name: Upload the step summaries
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: step-summaries-${{ github.job }}
          path: ${{ runner.temp }}/step-summaries/
          if-no-files-found: ignore

  uv-bump:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: uv-bump
    permissions:
      contents: read
    steps:
      - name: Checkout repoutils' source
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            /pyproject.toml
            /src/repoutils/
          sparse-checkout-cone-mode: false

      - name: Inspect the uv-bump environment's secrets
        env:
          SECRETS_JSON: ${{ toJSON(secrets) }}
        run: |
          trap 'mkdir -p "$RUNNER_TEMP/step-summaries" && cp "$GITHUB_STEP_SUMMARY" "$RUNNER_TEMP/step-summaries/inspect.md"' EXIT
          PYTHONPATH=src python3 -m repoutils secrets inspect --environment uv-bump

      # GitHub's API doesn't serve step summaries, so each step that writes one
      # copies it to step-summaries/ for this artifact (see AGENTS.md).
      - name: Upload the step summaries
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: step-summaries-${{ github.job }}
          path: ${{ runner.temp }}/step-summaries/
          if-no-files-found: ignore
