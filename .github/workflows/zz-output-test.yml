name: Composite output test

# Temporary: checks whether a composite action's outputs survive its step failing.
on:
  push:
    branches: [claude/project-thread-t866tt]
    paths: [.github/workflows/zz-output-test.yml]

permissions: {}

jobs:
  first:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      early: ${{ steps.test.outputs.early }}
    steps:
      - id: test
        uses: $/.github/actions/zz-output-test

  second:
    needs: first
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          EARLY: ${{ needs.first.outputs.early }}
        run: |
          echo "early=[$EARLY]"
          [ "$EARLY" = set ]
